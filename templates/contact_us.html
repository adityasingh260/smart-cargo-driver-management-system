<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Smart Cargo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .contact-page {
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact-container {
            width: 100%;
            max-width: 1000px;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .contact-header h1 {
            margin-bottom: 10px;
        }

        .contact-header p {
            opacity: 0.75;
        }

        .contact-content {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 25px;
        }

        .contact-card {
            padding: 30px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.20);
        }

        .contact-card h2 {
            margin-bottom: 20px;
        }

        .contact-info {
            margin-bottom: 22px;
        }

        .contact-info h3 {
            margin-bottom: 5px;
        }

        .contact-info p {
            margin: 0;
            opacity: 0.8;
        }

        .contact-form label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.15);
            color: inherit;
            outline: none;
            box-sizing: border-box;
        }

        .contact-form textarea {
            min-height: 140px;
            resize: vertical;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #888;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.12);
        }

        .contact-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
        }

        @media (max-width: 768px) {

            .contact-content {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <div class="contact-page">

        <div class="contact-container">


            <!-- HEADER -->

            <div class="contact-header">

                <h1>📞 Contact Us</h1>

                <p>
                    Have a question or need help?
                    Send us a message and our team will assist you.
                </p>

            </div>


            <div class="contact-content">


                <!-- CONTACT INFORMATION -->

                <div class="contact-card">

                    <h2>Get in Touch</h2>


                    <div class="contact-info">

                        <h3>📧 Email</h3>

                        <p>
                            support@smartcargo.com
                        </p>

                    </div>


                    <div class="contact-info">

                        <h3>📞 Phone</h3>

                        <p>
                            +91 XXXXX XXXXX
                        </p>

                    </div>


                    <div class="contact-info">

                        <h3>📍 Location</h3>

                        <p>
                            Prayagraj, Uttar Pradesh, India
                        </p>

                    </div>


                    <div class="contact-info">

                        <h3>🕐 Support Hours</h3>

                        <p>
                            Monday - Saturday
                        </p>

                        <p>
                            9:00 AM - 6:00 PM
                        </p>

                    </div>

                </div>


                <!-- CONTACT FORM -->

                <div class="contact-card">

                    <h2>Send Us a Message</h2>


                    <form
                        method="POST"
                        class="contact-form"
                    >


                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="Enter your subject"
                            required
                        >


                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            placeholder="Write your message here..."
                            required
                        ></textarea>


                        <button
                            type="submit"
                            class="contact-btn"
                        >
                            Send Message
                        </button>

                    </form>

                </div>

            </div>


            <a
                href="javascript:history.back()"
                class="back-btn"
            >
                ← Go Back
            </a>

        </div>

    </div>


    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

    <script src="{{ url_for('static', filename='js/3d.js') }}"></script>

</body>

</html>
