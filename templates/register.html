<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Cargo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            Smart Cargo
        </div>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </nav>


    <!-- Register Section -->
    <section class="section">

        <h2>Create Account</h2>

        <p class="section-intro">
            Register as a customer or driver.
        </p>


        <div class="service-card"
             style="max-width: 500px; margin: 30px auto;">

            <form method="POST"
                  action="{{ url_for('register') }}">

                <!-- Full Name -->
                <label>Full Name</label>

                <input type="text"
                       name="name"
                       placeholder="Enter your full name"
                       required
                       style="width:100%; padding:12px; margin:10px 0 20px;">


                <!-- Email -->
                <label>Email</label>

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required
                       style="width:100%; padding:12px; margin:10px 0 20px;">


                <!-- Mobile -->
                <label>Mobile Number</label>

                <input type="tel"
                       name="mobile"
                       placeholder="Enter mobile number"
                       required
                       style="width:100%; padding:12px; margin:10px 0 20px;">


                <!-- Password -->
                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Create password"
                       required
                       style="width:100%; padding:12px; margin:10px 0 20px;">


                <!-- Role -->
                <label>Register As</label>

                <select name="role"
                        required
                        style="width:100%; padding:12px; margin:10px 0 20px;">

                    <option value="">Select Role</option>

                    <option value="customer">
                        Customer
                    </option>

                    <option value="driver">
                        Driver
                    </option>

                </select>


                <!-- Register Button -->
                <button type="submit"
                        class="btn primary-btn"
                        style="border:none; cursor:pointer;">

                    Register

                </button>

            </form>


            <!-- Login Link -->
            <p style="margin-top:20px;">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <h3>Smart Cargo & Driver Management System</h3>

        <p>
            Smart solution for modern goods transportation.
        </p>

        <p class="copyright">
            © 2026 Smart Cargo. All Rights Reserved.
        </p>

    </footer>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/3d.js') }}"></script>
</body>

</html>
